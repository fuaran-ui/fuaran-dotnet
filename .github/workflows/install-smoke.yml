name: Clean-machine install smoke

# Does a stranger, on a machine that has never seen this repository, get the
# CURRENT release out of the public registries and the same canonical wire bytes
# from either host?
#
# Nothing in this repo's own gate can answer that. Every suite runs against the
# projects in this checkout, which is the right lane for "does the code agree with
# itself" and structurally blind to the two ways a release actually fails a
# newcomer: a package that does not RESTORE at all (a missing file in the pack, a
# version tagged but never published, a dependency the public feed cannot see),
# and two hosts whose PUBLISHED bytes disagree while their sources do not.
#
# THE FIXTURES ARE NOT DUPLICATED HERE, and that is the whole design. The smoke
# authors one tree through each tier's own ergonomic surface and compares the
# encoded bytes, so the two legs must be the SAME two legs on both sides or the
# comparison certifies nothing. They live in the sibling TypeScript
# implementation (`dev-scripts/install-smoke/`, a public repository), and this
# workflow checks that repository out rather than copying them. A copy would drift
# exactly when it mattered: the day one tier's authoring surface changed and the
# other's fixture did not follow.
#
# WHEN IT RUNS, and why it is not on every push: the inputs are the REGISTRIES,
# not this branch, so a push cannot change the answer — but a RELEASE can, and so
# can a registry that drops or re-tags a version under us.
#
#   * after a successful publish run — the first moment the claim is about the
#     release just cut. This is the leg the sibling's own copy of this workflow
#     structurally cannot provide: it fires on ITS publish, and a .NET release
#     moves the packages this repo owns without moving one of theirs.
#   * weekly, offset from the sibling's Monday run so a registry outage does not
#     take both reports out at once;
#   * on demand.
#
# A failure here is never "the branch is broken": it is a published artefact that a
# newcomer cannot use, which is a louder finding than anything in the push lane.
#
# Green by hand on 2026-07-24 and unautomated from then until Phase 1674.

on:
  workflow_run:
    workflows: ['Publish packages']
    types: [completed]
  schedule:
    # Thursdays, 05:30 UTC.
    - cron: '30 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # A publish run that FAILED says nothing about the registries, so do not draw
    # a conclusion from it. The schedule and the manual trigger carry no
    # `workflow_run` context and pass this by the second clause.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # The fixtures only. This repo's own sources are deliberately NOT checked
      # out: a leg that could see them could restore from them.
      - name: Check out the shared install-smoke fixtures
        uses: actions/checkout@v7
        with:
          repository: fuaran-ui/fuaran-ts
          sparse-checkout: dev-scripts/install-smoke
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No global.json on purpose: this leg restores a floating package from the
      # public registry with a plain SDK, exactly as a newcomer's machine would.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # `npm`, not pnpm, and no lockfile: a newcomer types `npm install`.
      - name: Install the published package set from npm
        working-directory: dev-scripts/install-smoke/ts
        run: npm install --no-audit --no-fund

      - name: Emit the TypeScript leg's canonical bytes
        working-directory: dev-scripts/install-smoke/ts
        run: node smoke.mjs > "$GITHUB_WORKSPACE/smoke-ts.json"

      - name: Emit the F# leg's canonical bytes
        working-directory: dev-scripts/install-smoke/fs
        run: dotnet run --nologo > "$GITHUB_WORKSPACE/smoke-fs.json"

      # Phase 1865 - the restored Fuaran.UI package carries its XML documentation file, and the
      # file documents a named public member, so a newcomer's editor shows the `///` comments on
      # hover. The subject is the registry's bytes in the package cache the F# leg just filled,
      # never a local build. `Action.dispatch` is the member STABILITY.md's 0.47.0 entry first
      # promised hover documentation for. A release older than 0.98.0, the first to ship the file,
      # is reported rather than failed: nothing can add the file to a version already published.
      - name: The restored Fuaran.UI package carries its XML documentation
        run: |
          cache="${NUGET_PACKAGES:-$HOME/.nuget/packages}/fuaran.ui"
          version=$(ls "$cache" | sort -V | tail -1)
          if [ -z "$version" ]; then
            echo "::error::The F# leg restored no Fuaran.UI package into $cache."
            exit 1
          fi
          echo "Restored Fuaran.UI $version"
          if [ "$(printf '%s\n' "$version" 0.98.0 | sort -V | head -1)" != 0.98.0 ]; then
            echo "::notice::Fuaran.UI $version predates 0.98.0, the first release to ship its XML documentation; not asserted."
            exit 0
          fi
          xml="$cache/$version/lib/net10.0/Fuaran.UI.xml"
          if [ ! -f "$xml" ]; then
            echo "::error::Fuaran.UI $version ships no lib/net10.0/Fuaran.UI.xml - a consumer sees no documentation on hover."
            exit 1
          fi
          python3 - "$xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          member = "M:Fuaran.UI.Action.dispatch``1(``0)"
          found = [m for m in ET.parse(sys.argv[1]).getroot().iter("member") if m.get("name") == member]
          summary = found[0].find("summary") if found else None
          if summary is None or not "".join(summary.itertext()).strip():
              print(f"::error::{sys.argv[1]} has no <summary> for {member}.")
              sys.exit(1)
          print(f"{member}: documented.")
          PY

      # Compared TRIMMED. The trailing newline belongs to the two `print` calls,
      # not to the wire document.
      - name: The two hosts' published bytes must be identical
        run: |
          ts=$(tr -d '\r' < smoke-ts.json)
          fs=$(tr -d '\r' < smoke-fs.json)
          echo "TypeScript: $ts"
          echo "F#        : $fs"
          if [ "$ts" != "$fs" ]; then
            echo "::error::The published TypeScript and F# hosts encode the same tree differently."
            diff <(printf '%s\n' "$ts") <(printf '%s\n' "$fs") || true
            exit 1
          fi
          # A leg that emitted NOTHING is a different finding from two legs that
          # disagree, and a string comparison of two empty strings is a pass.
          if [ -z "$ts" ]; then
            echo "::error::Both legs emitted nothing — neither host ran, so the match is vacuous."
            exit 1
          fi
          echo "Byte-identical across the published hosts."

      # Which versions the floats actually resolved to. A green run whose
      # resolution is unknown cannot be cited later, and a float is only honest if
      # the run records what it floated to.
      - name: Record the versions this run certified
        if: always()
        working-directory: dev-scripts/install-smoke
        run: |
          {
            echo '### Versions certified by this run'
            echo
            echo '```'
            ( cd ts && npm ls --depth=0 2>/dev/null ) || true
            ( cd fs && dotnet list package 2>/dev/null ) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
