name: Proof leg

# Phase 1754 — this tier's F* proof leg, on the kit's CI template.
#
# WHAT IT RUNS. `./proofs/check.ps1 -Runs 3` — three cold-cache verifications of every model
# under the PINNED prover, every SMT query proved three times over varying seeds, every escape
# hatch (assume / admit) reported as an error, each module's wall clock measured against the
# budget and floor declared in `proofs/modules.json`, and then the two host families that hold the
# committed models to a fresh generation from `src/Fuaran.UI.Idl/idl.json` and the claims ladder
# to this tree.
#
# WHY IT IS A SEPARATE, PATH-FILTERED JOB and not a stage of `ci.yml`. The leg takes minutes and
# downloads a ~200 MB prover, so folded into the main job it would be paid on every change to
# every file in the repository — and a job that expensive on every change is a job people learn
# to skip. The paths below charge it to exactly the commits that can change what it proves: the
# vocabulary it is generated from, and the leg itself. A change anywhere else cannot move a
# theorem here, because the models are GENERATED from that one file and the rest of the leg is
# the prover, the pin and the ladder.
#
# THE CACHE KEY HASHES THE PIN FILE, and that is the whole mechanism by which a prover bump
# reaches CI with no second edit: `proofs/fstar-pin.json` moves, the key changes, the next run
# downloads the new release. The pin itself is ONE number in the kit's repository; this
# repository's copy is declared in `copies.json`, so the estate sweep names it when it is behind.
#
# It DEPLOYS NOTHING — no publish, no artefact upload, no environment — so a branch push reaches
# no deploy job here, and there is none to reach. Keep it that way.

on:
  push:
    branches: [main]
    paths:
      - 'src/Fuaran.UI.Idl/idl.json'
      - 'proofs/**'
      - 'proofs.json'
      - '.github/workflows/proofs.yml'
  pull_request:
    paths:
      - 'src/Fuaran.UI.Idl/idl.json'
      - 'proofs/**'
      - 'proofs.json'
      - '.github/workflows/proofs.yml'

# Least privilege, stated rather than inherited. This workflow reads the tree and writes nothing
# back — no package publish, no deployment, no comment.
permissions:
  contents: read

jobs:
  proofs:
    # The pinned release is the Windows one (see `proofs/fstar-pin.json`'s shape); on another
    # runner set FSTAR_HOME to a matching release and the pin's version check still applies.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache the pinned F* release
        uses: actions/cache@v4
        with:
          path: proofs/.fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('proofs/fstar-pin.json') }}
      # -Runs 3 is the reproducibility claim made literal, not a timeout: a timeout says a run
      # died and nothing about which module. The per-module budgets say that, in modules.json.
      - name: Proof leg (./proofs/check.ps1 -Runs 3)
        shell: pwsh
        run: ./proofs/check.ps1 -Runs 3
