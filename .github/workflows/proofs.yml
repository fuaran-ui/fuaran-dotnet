name: Proof leg

# Phase 1754 — this tier's F* proof leg, on the kit's CI template.
#
# WHAT IT RUNS. `./proofs/check.ps1 -Runs 3` — three cold-cache verifications of every model
# under the PINNED prover, every SMT query proved three times over varying seeds, every escape
# hatch (assume / admit) reported as an error, each module's wall clock measured against the
# budget and floor declared in `proofs/modules.json`, and then the two host families that hold the
# committed models to a fresh generation from `src/Fuaran.UI.Idl/idl.json` and the claims ladder
# to this tree.
#
# WHY IT IS A SEPARATE, PATH-FILTERED JOB and not a stage of `ci.yml`. The leg takes minutes and
# downloads a ~200 MB prover, so folded into the main job it would be paid on every change to
# every file in the repository — and a job that expensive on every change is a job people learn
# to skip. The paths below charge it to exactly the commits that can change what it proves: the
# vocabulary it is generated from, and the leg itself. A change anywhere else cannot move a
# theorem here, because the models are GENERATED from that one file and the rest of the leg is
# the prover, the pin and the ladder.
#
# THE CACHE KEY HASHES THE PIN FILE, and that is the whole mechanism by which a prover bump
# reaches CI with no second edit: `proofs/fstar-pin.json` moves, the key changes, the next run
# downloads the new release. The pin itself is ONE number in the kit's repository; this
# repository's copy is declared in `copies.json`, so the estate sweep names it when it is behind.
#
# It DEPLOYS NOTHING — no publish, no artefact upload, no environment — so a branch push reaches
# no deploy job here, and there is none to reach. Keep it that way.

on:
  push:
    branches: [main]
    paths:
      - 'src/Fuaran.UI.Idl/idl.json'
      - 'proofs/**'
      - 'proofs.json'
      - '.github/workflows/proofs.yml'
  pull_request:
    paths:
      - 'src/Fuaran.UI.Idl/idl.json'
      - 'proofs/**'
      - 'proofs.json'
      - '.github/workflows/proofs.yml'

# Least privilege, stated rather than inherited. This workflow reads the tree and writes nothing
# back — no package publish, no deployment, no comment.
permissions:
  contents: read

jobs:
  proofs:
    # The pinned release is the Windows one (see `proofs/fstar-pin.json`'s shape); on another
    # runner set FSTAR_HOME to a matching release and the pin's version check still applies.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache the pinned F* release
        uses: actions/cache@v4
        with:
          path: proofs/.fstar
          key: fstar-${{ runner.os }}-${{ hashFiles('proofs/fstar-pin.json') }}
      # NU1301: nuget.config declares a `local` folder source three levels above this repo for
      # inner-loop iteration. It does not exist on the runner, and NuGet hard-errors on a missing
      # folder source rather than treating it as empty — so mint it, as `ci.yml` does. The leg's
      # HOST step builds `src/Fuaran.UI.Idl.Tests`, whose `Fuaran.Core.*` pins then restore
      # anonymously from nuget.org. Without this the models verify and the job still ends red, at
      # the restore, on the first run after a pin moves past what the runner happens to hold.
      - name: Create the empty local NuGet feed dir (NU1301 workaround)
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '..\..\..\local-nuget-feed') | Out-Null
      # -Runs 1, NOT the kit's -Runs 3, and the reduction is measured rather than convenient.
      # `VocabularyProofs` verifies in 5040s cold on a fast dev machine (proofs/modules.json), so
      # three cold runs of it alone is over four hours before anything else starts, against a
      # six-hour job ceiling on a slower runner. The deeper number is memory: that run peaked at
      # 90.6 GB committed on a 31.5 GB machine, most of the wall clock being paging, so a hosted
      # runner's smaller page file is the thing most likely to end this job — and it will end it
      # loudly, which is the correct failure. `proofs.json`'s `proof-leg` policy row declares the
      # reduced posture, because how many cold runs a check is IS the claim that row carries.
      # A developer still runs `-Runs 3` by hand; see proofs/README.md, "Running it".
      # Phase 2014 — the program leg's two differential hosts run over the PROGRAM
      # specification's corpus and the leg FAILS when it is absent; their host suite
      # also loads the tree wire corpus. Both are public, so no token. This job
      # checks this repo out at the workspace root, so the corpora cannot sit
      # beside it and are named through the environment instead.
      - name: Checkout the wire-format corpus (fuaran-ui-specification)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures
      - name: Checkout the program specification corpus (fuaran-program-specification)
        uses: actions/checkout@v4
        with:
          repository: Fuaran-Core/fuaran-program-specification
          path: fuaran-program-spec
      - name: Assert both corpora are where the environment names them
        shell: pwsh
        run: |
          if (-not (Test-Path wire-format-fixtures/manifest.json)) { throw 'wire-format corpus missing' }
          if (-not (Test-Path fuaran-program-spec/wire-fixtures/manifest.json)) { throw 'program specification corpus missing' }
      - name: Proof leg (./proofs/check.ps1 -Runs 1)
        shell: pwsh
        env:
          FUARAN_WIRE_FIXTURES: ${{ github.workspace }}/wire-format-fixtures
          FUARAN_PROGRAM_SPEC: ${{ github.workspace }}/fuaran-program-spec
        run: ./proofs/check.ps1 -Runs 1
