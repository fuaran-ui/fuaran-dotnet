name: Publish packages

# Pushes the Fuaran.UI.* packs to nuget.org — the public, no-auth-restore
# distribution channel. Triggered by a tag push matching `v*` (the operator's
# "ship this release" gesture) or by workflow_dispatch (the
# rerun-against-an-existing-tag escape hatch). The version baked into each
# pack is the <Version> property in Directory.Build.props at the tagged
# commit — see STABILITY.md for the per-release bump policy.

# WHAT THIS WORKFLOW REFUSES TO PUBLISH, and why each refusal exists:
#
#   * A NON-TAG DISPATCH. `workflow_dispatch` is documented as the
#     "rerun against an existing tag" escape hatch, but nothing enforced that:
#     dispatching it on `main` packed and pushed whatever `<Version>` happened to
#     stand there, which under the draft-slot model is routinely an UNRELEASED
#     draft. A draft published to nuget.org is a version no tag, no ledger record
#     and no STABILITY entry accounts for, and nuget.org does not un-publish. The
#     gate below refuses unless the ref is a tag; `force: true` is the deliberate
#     override and says so in the run.
#
#   * A TAG THAT DOES NOT MATCH THE PACKED <Version>. The tag is the release
#     gesture; `<Version>` is what actually gets packed. When they disagree the
#     registry and the tag name different things forever, and neither looks wrong
#     on its own. Same shape as the sibling Python hosts' version gate.
#
# `version release` remains the gesture that creates the tag. This only refuses to
# publish when the gesture was not made.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish from a NON-TAG ref. Deliberate override; recorded in the run."
        type: boolean
        default: false

permissions:
  contents: read
  # `id-token: write` lets the job request the GitHub OIDC token that
  # nuget.org's Trusted Publishing exchange turns into a short-lived API key.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # BEFORE the checkout and before anything is packed, so a refusal leaves no
      # artefact and costs nothing.
      - name: Refuse a non-tag ref
        run: |
          echo "ref=$GITHUB_REF ref_type=$GITHUB_REF_TYPE ref_name=$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "::warning::publishing from a NON-TAG ref ($GITHUB_REF_NAME) because force=true was set."
            else
              echo "::error::this workflow publishes on a v* TAG. The ref is $GITHUB_REF_NAME (type $GITHUB_REF_TYPE)."
              echo "::error::Under the draft-slot model the standing <Version> is routinely an UNRELEASED draft,"
              echo "::error::and nuget.org does not un-publish. Cut the tag, or re-dispatch with force=true if you mean it."
              exit 1
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert the tag equals the packed <Version>
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "NOT CHECKED — this run is on $GITHUB_REF_NAME ($GITHUB_REF_TYPE), so there is no tag to compare."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          # Read the ELEMENT, not a regex over the text. A props file's own comments
          # routinely contain the literal string "<Version>" — the orchestration
          # sibling's do, and `grep -oP '(?<=<Version>)[^<]+'` there returned a
          # sentence from a comment. A probe that answers a different question than
          # the one asked is worse than no probe.
          ver="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          t = ET.parse("Directory.Build.props")
          v = [e.text.strip() for e in t.iter() if e.tag.split("}")[-1] == "Version"]
          if len(v) != 1:
              raise SystemExit(f"expected exactly one <Version> element, found {v}")
          print(v[0])
          PY
          )"
          echo "tag=$tag  <Version>=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match the packed <Version> $ver — the registry and the tag would name different things, permanently."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Build.fs Pack target (and nuget.config's `local` source) resolve
      # the local folder feed at ../../../local-nuget-feed relative to the
      # repo root. On the runner there's no such folder, so we mint an empty
      # dir at that exact depth: NuGet hard-errors (NU1301) on a missing
      # folder source rather than treating it as empty. Fuaran.Core.*
      # restores from nuget.org.
      - name: Create empty local-nuget-feed on the runner
        run: mkdir -p ../../../local-nuget-feed

      - name: Restore .NET tools
        run: dotnet tool restore

      # `-t Pack` selects the FAKE Pack target. A bare `-- Pack` is NOT a target
      # selector — FAKE ignores it and runs the default `All` target (Format ->
      # Build -> Test), packing nothing.
      # FUARAN_PACK_OUTPUT redirects the packs into a repo-local dir instead of
      # the workspace-shared feed, so the push step below pushes THIS repo's
      # output rather than whatever happens to sit in the shared folder. See the
      # push step's comment for why that distinction matters.
      - name: Pack
        env:
          FUARAN_PACK_OUTPUT: ${{ github.workspace }}/artifacts
        run: dotnet run --project Build.fsproj -- -t Pack

      # Auth is Trusted Publishing (OIDC): a policy on nuget.org (repo owner /
      # repo / this workflow's file name) exchanges the job's OIDC token for a
      # 1-hour API key — no long-lived key secret to rotate. NUGET_USER is the
      # nuget.org profile name the policy belongs to. The login step sits
      # immediately before the push so the temp key cannot expire mid-run.
      # --skip-duplicate keeps re-runs idempotent.
      # SHA-PINNED, not tag-pinned: this step exchanges the job's OIDC token for a
      # live nuget.org API key, so a moved `v1` is credential-bearing code nobody
      # reviewed — on the one path in this repository that can publish. `# v1.2.0`
      # records which release the digest is; Dependabot proposes the bumps.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          # Push from the repo-local artifacts dir the Pack step wrote, NOT from
          # the workspace-shared feed.
          #
          # This used to glob ../../../local-nuget-feed/*.nupkg — every .nupkg in
          # the shared folder, not this repo's output. It was safe here only
          # because the runner mints that folder empty; the same step on a
          # developer machine would enumerate ~1900 packs, nearly all of them
          # PRIVATE (Fuaran.UI.Orchestration.*, ToolUp.*, Fuaran.App.*,
          # Fuaran.Roadmap.*), and push them to the public registry.
          # --skip-duplicate would not have saved it: those ids do not exist on
          # nuget.org, so they would have been created, not skipped.
          #
          # nullglob so an empty dir yields an empty list (not the literal
          # pattern), and push each package individually — `dotnet nuget push`
          # takes a single root path, and a single-quoted wildcard is passed
          # to it verbatim (it does not shell-expand), which fails as a
          # literal filename.
          shopt -s nullglob
          pkgs=("$GITHUB_WORKSPACE"/artifacts/*.nupkg)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No .nupkg files found in artifacts/ — Pack produced nothing." >&2
            exit 1
          fi
          # Defence in depth behind the dedicated output dir: every packable
          # project in Build.fs carries a Fuaran.UI.* id, so anything else
          # reaching this loop means the output dir was re-pointed at a shared
          # location. Refuse rather than publish it.
          for pkg in "${pkgs[@]}"; do
            case "$(basename "$pkg")" in
              Fuaran.UI.*) ;;
              *)
                echo "refusing to push unexpected package id: $(basename "$pkg")" >&2
                echo "this workflow publishes only this repo's own Fuaran.UI.* packs." >&2
                exit 1
                ;;
            esac
          done
          for pkg in "${pkgs[@]}"; do
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
              --skip-duplicate
          done
