name: Notify downstream conformance gate

# This repository has no push-to-main build CI of its own (releases go through
# publish-packages.yml on tag pushes); this minimal workflow exists solely to fire
# a DOWNSTREAM cross-implementation wire-format conformance gate when the wire
# format could have changed here. Path filters in the consuming repository cannot
# see pushes to THIS one, so we POST a `wire-conformance` repository_dispatch to
# it (it listens on `repository_dispatch: types: [wire-conformance]`).
#
# The dispatch TARGET is a repository variable, `CONFORMANCE_DISPATCH_REPO`,
# rather than a literal. Two reasons, and the second is the durable one: a
# consumer can move or be replaced without touching this file, and this workflow
# is public while a consumer need not be. Same posture as the sibling TypeScript
# implementation's, deliberately.
#
# Credentials: the org-level Actions secret FUARAN_WORKSPACE_APP_PRIVATE_KEY is
# the private key of a GitHub App (app id 4797739) installed on the dispatch
# target only. The workflow mints a SHORT-LIVED installation token at run time
# (the App holds `Contents: write` there — the scope the repository_dispatch REST
# endpoint requires); no long-lived token is stored anywhere. The default
# GITHUB_TOKEN is scoped to THIS repo only and cannot dispatch cross-repo.
#
# [OPERATOR-GATED — both the org secret and the variable must be granted to this
# repo for this to fire; until then the job SKIPS rather than fails. A withdrawn
# secret, or a repo the grant has not reached, must not turn every push red: a
# permanently-red notify job is one people learn to scroll past, and it would sit
# beside the build results that matter.]

on:
  push:
    branches: [main]

# Least privilege, stated rather than inherited. The cross-repo dispatch below runs
# on a SHORT-LIVED App installation token, never on the job's own token, so the
# default one needs nothing beyond reading this repository.
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # A secrets expression is not valid in a step-level `if:`, so the presence
      # probe goes through an env-var step output instead. The VARIABLE is probed
      # in the same step and by the same rule: an unconfigured target is the same
      # "not granted here" state as an unconfigured key, and the two must gate
      # together or the token mint runs for a dispatch that cannot be addressed.
      - name: Check whether the dispatch credentials and target are granted here
        id: gate
        env:
          HAS_KEY: ${{ secrets.FUARAN_WORKSPACE_APP_PRIVATE_KEY != '' }}
          TARGET: ${{ vars.CONFORMANCE_DISPATCH_REPO }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ -n "$TARGET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "owner=${TARGET%%/*}" >> "$GITHUB_OUTPUT"
            echo "repo=${TARGET##*/}" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint an installation token for the dispatch target
        id: dispatch-token
        if: steps.gate.outputs.configured == 'true'
        # SHA-PINNED, not tag-pinned: this step receives the App private key and
        # mints a token with write scope on ANOTHER repository, so a moved `v2` is
        # credential-bearing code nobody reviewed. `# v2.2.2` records which release
        # the digest is; the Dependabot `github-actions` schedule proposes bumps as
        # reviewable PRs, so the pin stays a decision rather than a freeze.
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: 4797739
          private-key: ${{ secrets.FUARAN_WORKSPACE_APP_PRIVATE_KEY }}
          owner: ${{ steps.gate.outputs.owner }}
          repositories: ${{ steps.gate.outputs.repo }}

      - name: Trigger the downstream wire-format conformance gate
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          TARGET: ${{ vars.CONFORMANCE_DISPATCH_REPO }}
          SOURCE_REPO: fuaran-dotnet
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Operator-gated: until the key and the target are both configured here,
          # skip rather than fail. (The mint step above is if-guarded on the same
          # condition, so an unconfigured repo skips it and lands here tokenless.)
          if [ -z "$GH_TOKEN" ] || [ -z "$TARGET" ]; then
            echo "::notice::The downstream conformance dispatch is not configured here (needs the FUARAN_WORKSPACE_APP_PRIVATE_KEY secret and the CONFORMANCE_DISPATCH_REPO variable) — skipping."
            exit 0
          fi
          # Both values reach `gh` through the ENVIRONMENT rather than through an
          # expression, so neither is substituted into the script text.
          gh api "repos/$TARGET/dispatches" \
            --method POST \
            -f event_type=wire-conformance \
            -f "client_payload[source_repo]=$SOURCE_REPO" \
            -f "client_payload[sha]=$SOURCE_SHA"
